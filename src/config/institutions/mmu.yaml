task:
  name: essay_scoring
  description: Score Manchester Metropolitan University undergraduate essays from 0 to 100

classification:
  possible_values: ["0", "2", "5", "8", "12", "15", "18", "22", "25", "28", "32", "35", "38", "42", "45", "48", "52", "55", "58", "62", "65", "68", "72", "75", "78", "82", "85", "88", "92", "95", "98", "100"]

prompts:
  default_text_prompt_id: "A1_B2_C1"

calibration:
  seed: 42
  fraction: 0.2
  rmse:
    claude: 11.69
    gemini: 10.03
    gpt: 9.78
  best_prompts:
    claude: "A1_B2_C3"
    gemini: "A1_B2_C2"
    gpt: "A2_B3_C2"

aggregations:
  available_aggregations:
    - MedianAggregator
    - SurprisinglyPopularAggregator
    - SimpleMeanAggregator
    - WeightedMeanAggregator

models:
  available_models:
    - GPT
    - Claude
    - Gemini
