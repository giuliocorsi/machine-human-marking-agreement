task:
  name: essay_scoring
  description: Score Cambridge University Psychological and Behavioural Sciences undergraduate essays from 0 to 100

classification:
  possible_values: ["0", "10", "25", "35", "42", "45", "48", "52", "55", "58", "62", "65", "68", "72", "78", "84", "90"]

prompts:
  default_text_prompt_id: "A3_B1_C1"

calibration:
  seed: 42
  fraction: 0.2
  rmse:
    claude: 8.17
    gemini: 6.97
    gpt: 7.39
  best_prompts:
    claude: "A1_B2_C3"
    gemini: "A1_B2_C2"
    gpt: "A2_B3_C2"

aggregations:
  available_aggregations:
    - MedianAggregator
    - SurprisinglyPopularAggregator
    - SimpleMeanAggregator
    - WeightedMeanAggregator

models:
  available_models:
    - GPT
    - Claude
    - Gemini
