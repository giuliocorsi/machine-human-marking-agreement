task:
  name: essay_scoring
  description: Score University of Nottingham undergraduate essays using the standard marking scale

classification:
  possible_values: ["15", "25", "32", "35", "42", "45", "48", "52", "55", "58", "62", "65", "68", "72", "78", "85", "100"]

prompts:
  default_text_prompt_id: "A1_B2_C3"

calibration:
  seed: 42
  fraction: 0.2
  rmse:
    claude: 8.3
    gemini: 6.43
    gpt: 7.35
  best_prompts:
    claude: "A1_B2_C3"
    gemini: "A1_B2_C2"
    gpt: "A2_B3_C2"

aggregations:
  available_aggregations:
    - MedianAggregator
    - SurprisinglyPopularAggregator
    - SimpleMeanAggregator
    - WeightedMeanAggregator

models:
  available_models:
    - GPT
    - Claude
    - Gemini
