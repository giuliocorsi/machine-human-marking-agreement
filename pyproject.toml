[project]
name = "machine-human-marking-agreement"
version = "0.1.0"
description = ""
authors = [
    {name = "Anonymous"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "numpy (>=1.26,<3.0)",
    "scipy (>=1.11,<2.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "matplotlib (>=3.8,<4.0)",
    "pyyaml (>=6.0,<7.0)",
]

[project.scripts]
calibrate = "scripts.run_calibration:main"
score = "scripts.run_scoring:run"
bias-shift = "analysis.bias_correction.learn_bias_shift:main"
test-retest = "analysis.reliability.test_retest:main"

[tool.poetry]
packages = [
    {include = "src"},
    {include = "analysis"},
    {include = "scripts"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
